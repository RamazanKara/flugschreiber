# Optional local checks: make test acceptance overhead cover image helm demo; scripts/demo.sh; deploy/helm/check.sh.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOMAXPROCS: "2"
  GOFLAGS: "-p=2"

jobs:
  ci:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./test)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --concurrency=2

      - name: Unit tests
        run: go test -short -count=1 ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o dist/ ./cmd/...
