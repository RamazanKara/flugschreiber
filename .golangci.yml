version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - revive
    - staticcheck
    - unconvert
    - unused
    - usetesting

  settings:
    errcheck:
      # Close and Flush on a best-effort cleanup path, and Fprintf to an
      # http.ResponseWriter, have no useful error to act on.
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
        # Best-effort cleanup and response-writing paths where the error has no
        # useful reader. Writes whose errors matter are checked explicitly and
        # an exclusion never silences a check that exists.
        - (*os.File).Close
        - (*net/http.Server).Shutdown
        - os.Remove
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*encoding/json.Encoder).Encode
    revive:
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: false
    misspell:
      # The project documents EU regulation and uses British spelling
      # throughout ("organisation", "minimisation").
      locale: UK
      ignore-rules:
        # report.Artifact is an exported type; renaming the API to satisfy a
        # spelling locale would be the tail wagging the dog.
        - artifact
        - artifacts
        # CSS property and class names in the HTML renderer, not prose.
        - color
        - center

  exclusions:
    rules:
      # Tests deliberately ignore errors on cleanup paths and construct
      # deeply nested literals.
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          - noctx
          # bodyclose cannot see a close that happens inside a test helper.
          - bodyclose

formatters:
  enable:
    - gofmt
