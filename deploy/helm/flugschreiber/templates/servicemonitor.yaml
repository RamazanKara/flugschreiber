{{- if eq .Values.mode "central" }}
{{- if .Values.metrics.serviceMonitor.enabled }}
{{- $sm := .Values.metrics.serviceMonitor }}
{{- if not (or ($.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") $sm.skipCRDCheck) }}
{{- fail "metrics.serviceMonitor.enabled is true but monitoring.coreos.com/v1 is not present in this cluster, so nothing would scrape the proxy and nothing would say why. Install the Prometheus Operator, use metrics.podMonitor instead, or set metrics.serviceMonitor.skipCRDCheck=true when rendering offline with `helm template`." }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "flugschreiber.fullname" . }}
  {{- with $sm.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "flugschreiber.labels" . | nindent 4 }}
    {{- with $sm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with (merge (dict) $sm.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "flugschreiber.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.metrics.path }}
      scheme: {{ ternary "https" "http" .Values.tls.enabled }}
      interval: {{ $sm.interval }}
      scrapeTimeout: {{ $sm.scrapeTimeout }}
      honorLabels: {{ $sm.honorLabels }}
      {{- with $sm.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sm.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
