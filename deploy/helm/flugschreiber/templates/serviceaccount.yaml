{{- if eq .Values.mode "central" }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flugschreiber.serviceAccountName" . }}
  labels:
    {{- include "flugschreiber.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.serviceAccount.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The proxy never calls the Kubernetes API, so it is given no token to call it
# with. The account exists to carry cloud identity annotations for archiving
# and to give the pod an identity other than default.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
