{{- if eq .Values.mode "central" }}
{{- if .Values.modelServer.networkPolicy.enabled }}
{{- $np := .Values.modelServer.networkPolicy }}
{{- /*
This is the object that turns a nice log into evidence.

It sits on the model server, not on the proxy, and it says: only Flugschreiber
may talk to you. Without it, an application that still has the old base URL in
a ConfigMap reaches the model directly, is not recorded, and nothing anywhere
reports that it happened. With it, "everything that reached the model is in
this log" is a property of the cluster rather than a statement about how
carefully people configured their applications.

It only means anything if the CNI enforces NetworkPolicy. Several do not by
default. An unenforced policy is worse than no policy, because you will
believe it.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flugschreiber.fullname" . }}-model-server
  {{- with $np.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "flugschreiber.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    {{- toYaml $np.podSelector | nindent 4 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Namespace and pod selector together, so this keeps working when the
        # model server and the proxy live in different namespaces.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "flugschreiber.proxySelectorLabels" . | nindent 14 }}
        {{- with $np.additionalIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        {{- toYaml $np.ports | nindent 8 }}
{{- end }}
{{- end }}
