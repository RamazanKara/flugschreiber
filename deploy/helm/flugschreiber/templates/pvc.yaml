{{- if eq .Values.mode "central" }}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
{{- $annotations := merge (dict) .Values.persistence.annotations .Values.commonAnnotations -}}
{{- if .Values.persistence.keepOnUninstall }}
{{- /* Uninstalling a release must not delete evidence that is under a retention
       obligation. Removing this claim should be a deliberate act, not a side
       effect of `helm uninstall`. */ -}}
{{- $_ := set $annotations "helm.sh/resource-policy" "keep" }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "flugschreiber.claimName" . }}
  labels:
    {{- include "flugschreiber.labels" . | nindent 4 }}
    {{- with .Values.persistence.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- if .Values.persistence.storageClass }}
  {{- if eq "-" .Values.persistence.storageClass }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
