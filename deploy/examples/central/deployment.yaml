apiVersion: v1
kind: ServiceAccount
metadata:
  name: flugschreiber
  labels:
    app.kubernetes.io/name: flugschreiber
# The proxy never calls the Kubernetes API, so it gets no token to call it with.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flugschreiber
  labels:
    app.kubernetes.io/name: flugschreiber
spec:
  # One. Each pod owns its own hash chain and its own evidence directory, and
  # two pods appending to the same volume interleave records and break the
  # chain on the first concurrent write. If one pod is not enough throughput,
  # run several with separate volumes and verify each chain independently.
  replicas: 1
  strategy:
    # A rolling update would briefly have two pods holding the same volume.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flugschreiber
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flugschreiber
        app.kubernetes.io/component: proxy
    spec:
      serviceAccountName: flugschreiber
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Without fsGroup the mounted volume is root-owned and the process
        # cannot write, which surfaces as permission denied on the first
        # request rather than at startup.
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Enough to finish in-flight streamed responses, drain the evidence queue
      # and fsync. A clean termination loses nothing.
      terminationGracePeriodSeconds: 30
      containers:
        - name: flugschreiber
          image: ghcr.io/flugschreiber/flugschreiber:0.1.0
          args: ["serve"]
          env:
            - name: FLUGSCHREIBER_LISTEN
              value: ":8080"
            - name: FLUGSCHREIBER_UPSTREAM
              value: http://vllm.ai.svc.cluster.local:8000
            - name: FLUGSCHREIBER_DATA_DIR
              value: /var/lib/flugschreiber
            # hash keeps a digest of the exact request and response bytes and
            # no prompt text at rest. store keeps the text, which turns this
            # volume into a system holding personal data.
            - name: FLUGSCHREIBER_CONTENT_MODE
              value: hash
            # Floor is 180. The binary refuses to start below it.
            - name: FLUGSCHREIBER_RETENTION_DAYS
              value: "365"
            - name: FLUGSCHREIBER_LOG_LEVEL
              value: info
            # Pre-fills the generated documentation. Changes nothing at runtime.
            - name: FLUGSCHREIBER_ORGANISATION
              value: Muster GmbH
            - name: FLUGSCHREIBER_SYSTEM_NAME
              value: Support Assistant
            # Injected upstream only when the caller sent no Authorization
            # header of its own. Delete this block if you do not need it.
            - name: FLUGSCHREIBER_UPSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flugschreiber
                  key: upstream-api-key
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # No CPU limit. Every model call in the cluster goes through this
              # process, so throttling it adds latency to all of them.
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: evidence
              mountPath: /var/lib/flugschreiber
      volumes:
        - name: evidence
          persistentVolumeClaim:
            claimName: flugschreiber-evidence
