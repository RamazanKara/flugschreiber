# Re-verifies the hash chain every hour and fails the Job when it is broken,
# so a broken chain surfaces through whatever already alerts on failed Jobs
# rather than waiting for someone to think of checking.
#
# The mount is read-only. A verifier that can write to what it verifies is not
# a verifier.
#
# With --json the pod log contains head_hash. Posting that somewhere
# append-only, outside this cluster, pins what the log said at a known time,
# and closes some of the gap the hash chain leaves open on its own.
#
# Note the scheduling constraint: with a ReadWriteOnce claim this pod has to
# land on the same node as the proxy pod. On most clusters it will, because the
# volume is already attached there, but if the Job sits Pending forever that is
# why.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flugschreiber-verify
  labels:
    app.kubernetes.io/name: flugschreiber
    app.kubernetes.io/component: verify
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  # Failed Jobs are kept. A failed Job is the alert.
  failedJobsHistoryLimit: 5
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # One attempt. verify is a deterministic function of the files on disk,
      # so a retry cannot produce a different answer, and a retry that passed
      # after a failure would hide the failure.
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: flugschreiber
            app.kubernetes.io/component: verify
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: verify
              image: ghcr.io/flugschreiber/flugschreiber:0.1.0
              args:
                - verify
                - --dir
                - /var/lib/flugschreiber
                - --json
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                privileged: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: evidence
                  mountPath: /var/lib/flugschreiber
                  readOnly: true
          volumes:
            - name: evidence
              persistentVolumeClaim:
                claimName: flugschreiber-evidence
